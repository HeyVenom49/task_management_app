openapi: 3.0.3
info:
  title: Task Management API
  version: 1.0.0
  description: |
    Auth, projects, members, and tasks.
    Task PATCH authz: OWNER/creator = all fields; assignee = status only;
    other members = forbidden. Mixed assignee PATCH is rejected (403).
servers:
  - url: http://localhost:4000/api/v1
    description: Local

tags:
  - name: Health
  - name: Auth
  - name: Projects
  - name: Members
  - name: Tasks

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ErrorMessage:
      type: object
      required: [message]
      properties:
        message:
          type: string
        requestId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string

    TaskPriority:
      type: string
      enum: [VERY_LOW, LOW, MODERATE, HIGH, URGENT]

    TaskStatus:
      type: string
      enum: [NOT_STARTED, IN_PROGRESS, BLOCKED, COMPLETED]

    MemberRole:
      type: string
      enum: [OWNER, MEMBER]

    MemberStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    UserPublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        status:
          type: string

    AuthUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        creatorId:
          type: string
          format: uuid
        info:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Membership:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/MemberRole"
        status:
          $ref: "#/components/schemas/MemberStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MemberWithUser:
      allOf:
        - $ref: "#/components/schemas/Membership"
        - type: object
          properties:
            name:
              type: string
            email:
              type: string
              format: email

    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        creatorMemberId:
          type: string
          format: uuid
        assigneeMemberId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        priority:
          $ref: "#/components/schemas/TaskPriority"
        status:
          $ref: "#/components/schemas/TaskStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterBody:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 3
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72

    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserPublic"
        accessToken:
          type: string
        refreshToken:
          type: string
          description: Only when X-Client is mobile; otherwise httpOnly cookie

    CreateProjectBody:
      type: object
      required: [info]
      properties:
        info:
          type: string
          minLength: 1
          maxLength: 500

    CreateTaskBody:
      type: object
      required: [title, priority]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 500
          nullable: true
        priority:
          $ref: "#/components/schemas/TaskPriority"
        status:
          $ref: "#/components/schemas/TaskStatus"
        assigneeMemberId:
          type: string
          format: uuid
          nullable: true

    UpdateTaskBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 500
          nullable: true
        priority:
          $ref: "#/components/schemas/TaskPriority"
        status:
          $ref: "#/components/schemas/TaskStatus"
        assigneeMemberId:
          type: string
          format: uuid
          nullable: true

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      security: []
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /health/db:
    get:
      tags: [Health]
      security: []
      summary: Database ping
      responses:
        "200":
          description: OK

  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Created (user INACTIVE until email verified)
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/UserPublic"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login
      description: Rate limited. Send header X-Client=mobile to get refreshToken in body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: Email not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /auth/me:
    get:
      tags: [Auth]
      summary: Current access-token identity
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Refresh access token
      description: Uses refresh cookie or body.refreshToken (mobile).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        "401":
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /auth/logout:
    post:
      tags: [Auth]
      security: []
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /auth/verify-email:
    get:
      tags: [Auth]
      security: []
      summary: Verify email via token link
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid or expired link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /auth/resend-verification:
    post:
      tags: [Auth]
      security: []
      summary: Resend verification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Generic success (no email enumeration)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password (revokes sessions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 72
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          description: Unauthorized / invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /auth/forgot-password:
    post:
      tags: [Auth]
      security: []
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Generic success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /auth/reset-password:
    post:
      tags: [Auth]
      security: []
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 72
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /projects:
    get:
      tags: [Projects]
      summary: List my projects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      tags: [Projects]
      summary: Create project (creator becomes OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
                  membership:
                    $ref: "#/components/schemas/Membership"
        "409":
          description: Duplicate project info for creator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: Get project
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
        "403":
          description: Not an active member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    patch:
      tags: [Projects]
      summary: Update project (OWNER only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      tags: [Projects]
      summary: Delete project (OWNER only)
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /projects/{id}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Members]
      summary: List active members
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemberWithUser"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      tags: [Members]
      summary: Invite member by email (OWNER only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  member:
                    $ref: "#/components/schemas/Membership"
        "400":
          description: User not found / not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Already a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /projects/{id}/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/MemberId"
    delete:
      tags: [Members]
      summary: Soft-remove member (OWNER only)
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Cannot remove last owner / not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /projects/{id}/members/{memberId}/reactivate:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/MemberId"
    post:
      tags: [Members]
      summary: Reactivate member (platform ADMIN only)
      responses:
        "200":
          description: Reactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  member:
                    $ref: "#/components/schemas/Membership"
        "403":
          description: Not a platform admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /projects/{id}/transfer-ownership:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [Members]
      summary: Transfer ownership (atomic swap)
      description: Current OWNER becomes MEMBER; target ACTIVE MEMBER becomes OWNER.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newOwnerMemberId]
              properties:
                newOwnerMemberId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Transferred
          content:
            application/json:
              schema:
                type: object
                properties:
                  previousOwner:
                    $ref: "#/components/schemas/Membership"
                  newOwner:
                    $ref: "#/components/schemas/Membership"
        "400":
          description: Invalid target / self-transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: Not owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Target already owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /projects/{id}/tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Tasks]
      summary: List tasks
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      tags: [Tasks]
      summary: Create task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/Task"
        "400":
          description: Validation / invalid assignee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /projects/{id}/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [Tasks]
      summary: Get task
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/Task"
        "400":
          description: Task not found in project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    patch:
      tags: [Tasks]
      summary: Update task
      description: |
        OWNER or creator may send any UpdateTaskBody fields.
        Assignee may send only status; any other field → 403 (entire request rejected).
        Other members → 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/Task"
        "400":
          description: Not found / invalid assignee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: Not allowed to update these fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      tags: [Tasks]
      summary: Delete task (creator or OWNER)
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
