services:
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=task_management
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_management"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
       PORT: 4000
       NODE_ENV: production
       DATABASE_URL: postgres://postgres:postgres@postgres:5432/task_management
       REDIS_URL: redis://redis:6379
       JWT_SECRET: ${JWT_SECRET}
       JWT_EXPIRES_IN: 15m
       REFRESH_EXPIRES_IN: 7d
       FRONTEND_URL: http://localhost:3000
       COOKIE_SECURE: "false"
    depends_on:
       postgres:
        condition: service_healthy
       redis:
        condition: service_healthy
  
  frontend:
    build: 
      context: ./frontend
      args:
         VITE_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: